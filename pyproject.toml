[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-referee"
version = "0.1.1"
description = "Plug any AI agent into real evaluation scoring, guardrails, and observability tracing in minutes — framework-agnostic, 100% free, no signup, never touches your API key."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Ashish Mehrotra" }
]
keywords = [
    "ai-agents",
    "llm-evaluation",
    "guardrails",
    "observability",
    "opentelemetry",
    "llm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "rouge-score>=0.1.2",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
    # All three provider SDKs ship in core, on purpose. Checked with a clean
    # venv before deciding: google-genai is ~38MB installed, openai+anthropic
    # together are ~37MB — genuinely light, and every single person doing
    # `referee init` picks exactly one of these on their very first run. That's
    # a real, everyday step, not an edge case, so it shouldn't need a second
    # install command. Compare that to sentence-transformers (below), which
    # drags in PyTorch at 300MB+ for a feature the guided flow doesn't even
    # use by default.
    "google-genai>=0.1",
    "openai>=1.0",
    "anthropic>=0.30",
]

[project.optional-dependencies]
# Genuinely heavy, genuinely optional: neither of these is used by the guided
# 9-step flow in the README unless you go out of your way to opt in.
embedding = ["sentence-transformers>=2.2"]  # ~395MB with PyTorch — semantic-similarity scoring
dashboard = ["streamlit>=1.30"]             # ~180MB with pyarrow/pandas — the local web UI
all = [
    "sentence-transformers>=2.2",
    "streamlit>=1.30",
]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/mehrotra0307/agent-referee"
Repository = "https://github.com/mehrotra0307/agent-referee"
Issues = "https://github.com/mehrotra0307/agent-referee/issues"

[project.scripts]
referee = "referee.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["referee"]

[tool.hatch.build.targets.wheel.force-include]
"referee/eval/example_dataset.json" = "referee/eval/example_dataset.json"
